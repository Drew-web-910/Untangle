<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Untangle</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <div class="header">
      <span class="logo">Untangle</span>
      <label class="switch">
        <input type="checkbox" id="enabledToggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="section">
      <div class="section-label">Sensitivity</div>
      <input type="range" id="levelSlider" min="1" max="10" step="1" value="5" />
      <div class="level-labels">
        <span>Flag everything</span>
        <span>Only extreme</span>
      </div>
      <div class="level-name" id="levelName">Balanced</div>
    </div>

    <div class="section stats">
      <span id="statsText">Refresh the page after changing settings.</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
